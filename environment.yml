name: npe-bg

channels:
  - conda-forge

dependencies:
  # sbi 0.24+ requires Python >=3.10. Python 3.12 is also supported by
  # current PyTorch wheels on macOS and Linux.
  - python=3.12
  - pip>=24

  # Scientific/data stack imported directly by this repository.
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scipy>=1.12,<2
  - matplotlib>=3.8,<4
  - scikit-learn>=1.4,<2
  - joblib>=1.3,<2

  # Notebook support.
  - jupyterlab>=4,<5
  - ipykernel>=6,<7

  - pip:
      # PyTorch recommends pip-distributed binaries on macOS. Keep sbi below
      # 0.28 because this repository currently imports its legacy SNPE alias.
      - torch>=2.5,<3
      - sbi==0.26.1
